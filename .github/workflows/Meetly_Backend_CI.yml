name: Meetly_Backend_CI

on:
    push:
        branches:
            - main

env:
    APP_NAME: Meetly-Backend
    IMAGE_NAME: meetly_backend

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ./Meetly_Backend
        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Set up .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: 10.0.x

            - name: Restore dependencies
              run: dotnet restore

            - name: Build project
              run: dotnet build --no-restore

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{secrets.DOCKER_USERNAME}}
                  password: ${{secrets.DOCKER_TOKEN}}

            - name: Build Docker image
              run: docker build -t ${{secrets.DOCKER_USERNAME}}/${{env.IMAGE_NAME}}:${{github.sha}} .

            - name: Push Docker image
              run: docker push ${{secrets.DOCKER_USERNAME}}/${{env.IMAGE_NAME}}:${{github.sha}}

            - name: Install EF Core tools
              run: dotnet tool install --global dotnet-ef

            - name: Generate migration script
              run: dotnet ef migrations script --idempotent -o migrate.sql
              env:
                  ConnectionStrings__DefaultConnection: "Server=localhost;Database=dummy;"

            - name: Apply migrations to Azure SQL
              uses: azure/sql-action@v2.3
              with:
                  connection-string: ${{secrets.AZURE_SQL_CONNECTION_STRING}}
                  path: ./Meetly_Backend/migrate.sql

            - name: Deploy to Azure Web App
              uses: azure/webapps-deploy@v3
              with:
                  app-name: ${{env.APP_NAME}}
                  publish-profile: ${{secrets.AZURE_WEBAPP_PUBLISH_PROFILE}}
                  images: ${{secrets.DOCKER_USERNAME}}/${{env.IMAGE_NAME}}:${{github.sha}}
